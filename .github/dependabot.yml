version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      electron-framework:
        patterns:
          - "electron"
          - "electron-builder"
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
