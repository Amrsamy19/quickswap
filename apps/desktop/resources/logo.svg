<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="440" height="100">
  <defs>
    <linearGradient id="logoShieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="logoSwapCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="logoSwapBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (scaled 0.16 roughly inside 80x80 box at x=10, y=10) -->
  <g transform="translate(10, 10) scale(0.156)">
    <!-- Container Squircle -->
    <rect x="24" y="24" width="464" height="464" rx="108" fill="#0E1726" stroke="#1E293B" stroke-width="8" />
    
    <!-- Outer Glow Arc Accent -->
    <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="url(#logoShieldStroke)" stroke-width="6" opacity="0.6" />

    <!-- Security Shield Outer Shell -->
    <path d="M 256 78 C 342 78 402 108 402 108 C 402 248 358 358 256 424 C 154 358 110 248 110 108 C 110 108 170 78 256 78 Z" 
          fill="#0B0F17" stroke="url(#logoShieldStroke)" stroke-width="14" stroke-linejoin="round" />

    <!-- TOP-RIGHT SWAP CHEVRON -->
    <path d="M 216 160 L 316 160 C 334 160 348 174 348 192 L 348 244 L 374 244 L 326 304 L 278 244 L 304 244 L 304 204 L 216 204 Z" 
          fill="url(#logoSwapCyan)" filter="url(#logoGlow)" />

    <!-- BOTTOM-LEFT SWAP CHEVRON -->
    <path d="M 296 344 L 196 344 C 178 344 164 330 164 312 L 164 260 L 138 260 L 186 200 L 234 260 L 208 260 L 208 300 L 296 300 Z" 
          fill="url(#logoSwapBlue)" filter="url(#logoGlow)" />

    <!-- Center Vault Core -->
    <circle cx="256" cy="242" r="14" fill="#38BDF8" filter="url(#logoGlow)" />
  </g>

  <!-- Wordmark Text -->
  <text x="108" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    Quick<tspan fill="#38BDF8">swap</tspan>
  </text>

  <!-- Tagline -->
  <text x="110" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#06B6D4">
    DESKTOP VAULT
  </text>
</svg>
